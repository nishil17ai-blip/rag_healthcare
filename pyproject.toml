[project]
name = "rag-healthcare"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "groq>=1.0.0",
    "chromadb>=1.0.0",
    "sentence-transformers>=3.0.0",
    "pymupdf>=1.24.0",
    "requests>=2.32.0",
    "langgraph>=1.0.0",
    "ddgs"
]

[tool.vercel]
entrypoint = "app.api:app"